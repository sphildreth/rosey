[workspace]
resolver = "2"
members = [
  "crates/rosey-core",
  "crates/rosey-fs",
  "crates/rosey-metadata",
  "crates/rosey-cli",
  "crates/rosey-tui",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/sphildreth/rosey"
authors = ["Rosey Contributors"]
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
decentdb = { git = "https://github.com/sphildreth/decentdb", tag = "v2.7.0", default-features = false }
directories = "6"
libc = "0.2"
once_cell = "1"
pretty_assertions = "1"
proptest = "1"
quick-xml = "0.37"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"
